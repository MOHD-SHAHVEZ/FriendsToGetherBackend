spring.application.name=friendstogether

# ===============================
# DATABASE CONFIGURATION (MySQL)
# ===============================
# 'friendstogether_db' ki jagah apne database ka naam likhein
spring.datasource.url=jdbc:mysql://localhost:3306/friendstogether_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root

# Yahan apna MySQL password dalein
spring.datasource.password=HelloWorld+1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
# 'update' se tables automatically ban jayengi/update ho jayengi
spring.jpa.hibernate.ddl-auto=update

# Console mein SQL queries dekhne ke liye
spring.jpa.show-sql=true

# SQL ko sundar (readable) format mein dekhne ke liye
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# SERVER CONFIGURATION
# ===============================
#server.port=8080
# server.error.include-message=always [ -> ya line depricated ho gai]
# now this line is work in new version:
#server.error.message-condition=always
# -------------------------------->

# ===============================
# MODERN ERROR HANDLING (Spring Boot 4 Standard)
# ===============================
server.port=8080
# Naya standard RFC 7807 (Problem Details) use karna hai:
spring.mvc.problemdetails.enabled=true
# [REPLACED/ADDED] - Warning hatane ke liye
spring.jpa.open-in-view=false

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# ===============================
# DEVTOOLS (Auto-Restart)
# ===============================
spring.devtools.restart.enabled=true

# ===============================
# SECURITY (DEFAULT PASSWORD GENERATE NA HO)
# ===============================

# [ADDED] - console mein random password nahi aayega -> mana username or password: mohd & pass123

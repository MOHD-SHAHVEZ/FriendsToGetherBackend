# ===============================
# PRODUCTION CONFIGURATION (Render)
# ===============================
# This profile is auto-activated by the Dockerfile.
# All values are read from Render environment variables.

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}

# ===============================
# DATABASE (MySQL - Aiven / External)
# ===============================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Connection pool tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ===============================
# REDIS
# ===============================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60s

spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=1

# ===============================
# EMAIL (Gmail SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# AWS S3
# ===============================
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region.static=eu-north-1
cloud.aws.stack.auto=false
app.s3.bucket=${S3_BUCKET_NAME:frientdstogetherprofile}

# ===============================
# OAUTH 2.0 (Google)
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# ===============================
# APPLICATION OAUTH REDIRECT
# ===============================
app.oauth.redirect-uri=${FRONTEND_OAUTH_REDIRECT_URI}

# ===============================
# SECURITY
# ===============================
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD}

# ===============================
# PROBLEM DETAILS (RFC 7807)
# ===============================
spring.mvc.problemdetails.enabled=true

# ===============================
# DEVTOOLS OFF IN PRODUCTION
# ===============================
spring.devtools.restart.enabled=false

# ===============================
# LOGGING (Production - less verbose)
# ===============================
logging.level.root=WARN
logging.level.com.gaur.friendstogether=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# ===============================
# ACTUATOR (Health Checks for Render)
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
